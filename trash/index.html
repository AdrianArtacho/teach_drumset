<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drumset layout: 'Come Out And Play'</title>
    <style>
        body { text-align: center; font-family: Arial, sans-serif; }
        .drumset { position: relative; display: inline-block; }
        .drum-element { position: absolute; cursor: pointer; color: red; font-weight: bold; }
        .kick { top: 205px; left: 205px; }
        .snare { top: 179px; left: 304px; }
        .snarerim { top: 200px; left: 314px; }
        .hihatopen { top: 97px; left: 391px; }
        .hihatclosed { top: 130px; left: 385px; }
        .pedal { top: 327px; left: 372px; }
        .ride { top: 89px; left: 60px; }
        .crash { top: 35px; left: 160px; }
        .tomlow { top: 183px; left: 73px; }
        .tommid { top: 121px; left: 121px; }
        .tommidrim { top: 141px; left: 116px; }
        .tomhigh { top: 111px; left: 285px; }
        .tomhighrim { top: 131px; left: 285px; }
    </style>
</head>
<body>
    <h1>Drumset layout: 'Come Out And Play'</h1>
    <div class="drumset" data-id="hymn1">
        <img src="./img/drumset-left.png" alt="Drum Set" width="500">
        <div class="drum-element kick" onclick="playSound('kick')">Kick [k]</div>
        <div class="drum-element snare" onclick="playSound('snare')">Snare [s]</div>
        <div class="drum-element snarerim" onclick="playSound('snarerim')">(rim) [z]</div>
        <div class="drum-element hihatopen" onclick="playSound('hihatopen')">Hi-Hat [o]</div>
        <div class="drum-element hihatclosed" onclick="playSound('hihatclosed')">(closed) [h]</div>
        <div class="drum-element pedal" onclick="playSound('pedal')">Pedal [p]</div>
        <div class="drum-element tomlow" onclick="playSound('tomlow')">Low [l]</div>
        <div class="drum-element tommid" onclick="playSound('tommid')">Mid [m]</div>
        <div class="drum-element tommidrim" onclick="playSound('tommidrim')">(rim) [n]</div>
        <div class="drum-element tomhigh" onclick="playSound('tomhigh')">High [t]</div>
        <div class="drum-element tomhighrim" onclick="playSound('tomhighrim')">(rim) [d]</div>
        <div class="drum-element ride" onclick="playSound('ride')">Ride [r]</div>
        <div class="drum-element crash" onclick="playSound('crash')">Crash [c]</div>
    </div>

    <script>
        function playSound(drum) {
            const soundPath = `./sounds/COAP/${drum}.mp3`;
            const audio = new Audio(soundPath);
            audio.play();
        }

        document.addEventListener('keydown', function(event) {
            const keyMap = {
                'k': 'kick',
                'c': 'crash',
                'r': 'ride',
                'p': 'pedal',
                's': 'snare',
                'z': 'snarerim',
                'h': 'hihatclosed',
                'o': 'hihatopen',
                'l': 'tomlow',
                'm': 'tommid',
                'n': 'tommidrim',
                't': 'tomhigh',
                'd': 'tomhighrim'
            };
            const drum = keyMap[event.key.toLowerCase()];
            if (drum) playSound(drum);
        });
    </script>
</body>
</html>
