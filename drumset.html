<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Virtual Drumset</title>
  <style>
    body { text-align: center; font-family: Arial, sans-serif; }
    .toolbar { margin: 1rem 0; }
    .drumset { position: relative; display: inline-block; }
    .drum-element {
      position: absolute;
      cursor: pointer;
      color: red;
      font-weight: bold;
      transition: transform 80ms ease;
    }
    .drum-element.active {
      transform: scale(1.12);
      text-shadow: 0 0 6px rgba(255, 0, 0, 0.7);
    }

    .kick { top: 205px; left: 205px; }
    .snare { top: 179px; left: 304px; }
    .snarerim { top: 200px; left: 314px; }
    .hihatopen { top: 97px; left: 391px; }
    .hihatclosed { top: 130px; left: 385px; }
    .pedal { top: 327px; left: 372px; }
    .ride { top: 89px; left: 60px; }
    .crash { top: 35px; left: 160px; }
    .tomlow { top: 183px; left: 73px; }
    .tommid { top: 121px; left: 121px; }
    .tommidrim { top: 141px; left: 116px; }
    .tomhigh { top: 111px; left: 285px; }
    .tomhighrim { top: 131px; left: 285px; }

    .status { font-size: 0.9rem; color: #555; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <h1>Virtual Drumset</h1>

  <div class="toolbar">
    <label for="kitSelect"><strong>Sound set:</strong></label>
    <select id="kitSelect" aria-label="Choose drum kit"></select>
    <div class="status" id="statusText">Loading kits…</div>
  </div>

  <div class="drumset">
    <img src="./img/drumset-left.png" alt="Drum Set" width="500">
    <div class="drum-element kick" data-drum="kick" onclick="playSound('kick')">Kick [k]</div>
    <div class="drum-element snare" data-drum="snare" onclick="playSound('snare')">Snare [s]</div>
    <div class="drum-element snarerim" data-drum="snarerim" onclick="playSound('snarerim')">(rim) [z]</div>
    <div class="drum-element hihatopen" data-drum="hihatopen" onclick="playSound('hihatopen')">Hi-Hat [o]</div>
    <div class="drum-element hihatclosed" data-drum="hihatclosed" onclick="playSound('hihatclosed')">(closed) [h]</div>
    <div class="drum-element pedal" data-drum="pedal" onclick="playSound('pedal')">Pedal [p]</div>
    <div class="drum-element tomlow" data-drum="tomlow" onclick="playSound('tomlow')">Low [l]</div>
    <div class="drum-element tommid" data-drum="tommid" onclick="playSound('tommid')">Mid [m]</div>
    <div class="drum-element tommidrim" data-drum="tommidrim" onclick="playSound('tommidrim')">(rim) [n]</div>
    <div class="drum-element tomhigh" data-drum="tomhigh" onclick="playSound('tomhigh')">High [t]</div>
    <div class="drum-element tomhighrim" data-drum="tomhighrim" onclick="playSound('tomhighrim')">(rim) [d]</div>
    <div class="drum-element ride" data-drum="ride" onclick="playSound('ride')">Ride [r]</div>
    <div class="drum-element crash" data-drum="crash" onclick="playSound('crash')">Crash [c]</div>
  </div>

  <script>
    let currentKit = null;
    const kitSelect = document.getElementById('kitSelect');
    const statusText = document.getElementById('statusText');

    async function loadKits() {
      try {
        const response = await fetch('./sounds/manifest.json');
        const data = await response.json();
        const kits = data.kits;
        if (!kits || kits.length === 0) throw new Error("No kits found");

        // Populate dropdown
        kitSelect.innerHTML = '';
        kits.forEach(kit => {
          const opt = document.createElement('option');
          opt.value = kit;
          opt.textContent = kit;
          kitSelect.appendChild(opt);
        });

        // Load last saved kit or default to first
        currentKit = localStorage.getItem('currentKit') || kits[0];
        if (!kits.includes(currentKit)) currentKit = kits[0];
        kitSelect.value = currentKit;
        statusText.textContent = 'Current kit: ' + currentKit;
      } catch (err) {
        console.error(err);
        statusText.textContent = '⚠️ Error loading manifest.json';
      }
    }

    kitSelect.addEventListener('change', () => {
      currentKit = kitSelect.value;
      localStorage.setItem('currentKit', currentKit);
      statusText.textContent = 'Current kit: ' + currentKit;
    });

    function flashLabel(drum) {
      const el = document.querySelector(`.drum-element[data-drum="${drum}"]`);
      if (!el) return;
      el.classList.add('active');
      setTimeout(() => el.classList.remove('active'), 120);
    }

    function playSound(drum) {
      if (!currentKit) return;
      const soundPath = `./sounds/${currentKit}/${drum}.mp3`;
      const audio = new Audio(soundPath);
      audio.play().catch(() => console.warn('Audio failed to play:', soundPath));
      flashLabel(drum);
    }

    document.addEventListener('keydown', event => {
      const keyMap = {
        'k': 'kick', 'c': 'crash', 'r': 'ride', 'p': 'pedal',
        's': 'snare', 'z': 'snarerim', 'h': 'hihatclosed', 'o': 'hihatopen',
        'l': 'tomlow', 'm': 'tommid', 'n': 'tommidrim', 't': 'tomhigh', 'd': 'tomhighrim'
      };
      const drum = keyMap[event.key.toLowerCase()];
      if (drum) playSound(drum);
    });

    window.addEventListener('DOMContentLoaded', loadKits);
  </script>
</body>
</html>
